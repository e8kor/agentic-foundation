name: example-plugin
version: 1.1.0
core: ">=2.0.0"
provenance: third-party
enabled: true
extension_points: [skill, tool, hook, policy, mcp]
contributes:
  skills:
    - skills/release-checklist/
  tools:
    - tools/summarize.sh
  memory: []
policy:
  archive_after_days: 365
hooks:
  on-save: hooks/on-save.sh
allowed_tools: [bash, python, git]
mcp_servers:
  - name: example-db
    command: "npx @modelcontextprotocol/server-postgres"
    args: []
    env:
      DATABASE_URL: "$EXAMPLE_DB_URL"
description: "Example extension demonstrating skill, tool, hook, policy, and mcp extension points."
